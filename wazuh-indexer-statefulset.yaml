apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-indexer
  namespace: monitoring
spec:
  serviceName: wazuh-indexer
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-indexer
  template:
    metadata:
      labels:
        app: wazuh-indexer
    spec:
      containers:
      - name: wazuh-indexer
        image: wazuh/wazuh-indexer:4.5.2
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        env:
        - name: OPENSEARCH_JAVA_OPTS
          value: "-Xms1g -Xmx1g"
        - name: WAZUH_INDEXER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-credentials
              key: indexer-password
        ports:
        - containerPort: 9200
          name: http
        - containerPort: 9300
          name: transport
        volumeMounts:
        - name: wazuh-indexer-data
          mountPath: /var/lib/wazuh-indexer
  volumeClaimTemplates:
  - metadata:
      name: wazuh-indexer-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: vsphere-storage
      resources:
        requests:
          storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-indexer
  namespace: monitoring
spec:
  selector:
    app: wazuh-indexer
  ports:
  - port: 9200
    targetPort: 9200
    name: http
  type: ClusterIP